name: Arch-C CI

on:
  push:
    branches: [main, '架构C', arch-c]
  pull_request:
    branches: [main]

# 同一分支的新提交直接顶掉还在排队的旧 run，不用等上一次跑完。
# main 上不取消：合并后的验证要留完整记录。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Windows 运行器默认 ANSI 代码页是 1252，Python 的 stdout 会按它编码，
  # 脚本里的中文 print 直接抛 UnicodeEncodeError（--check 第一条输出就挂）。
  # 打开 UTF-8 模式后所有 python 步骤都能正常打印与读写中文。
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  structure-and-static:
    name: 结构 / 编码 / 统计校验
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 保留 CRLF：结构校验会检查行尾约定
          config: |
            core.autocrlf=false
            core.eol=crlf

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 工程文件无漂移（--check）
        run: python tools/verify_structure.py --check

      - name: 角色 / 技能统计为最新
        run: python tools/gen_stats.py --check

      - name: git diff --check（空白错误）
        run: git diff --check

      - name: UTF-8 / CRLF / BOM 约定
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Recurse -File -Include *.h,*.cpp,*.vcxproj,*.filters,*.props,*.json |
                   Where-Object { $_.FullName -notmatch '[\\/](dep|x64|\.git|\.vs)[\\/]' }
          $bad = @()
          foreach ($f in $files) {
            $bytes = [System.IO.File]::ReadAllBytes($f.FullName)
            if ($bytes.Length -eq 0) { continue }
            # UTF-8 合法性（有 BOM 则去 BOM 后校验）
            $off = 0
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) { $off = 3 }
            $enc = New-Object System.Text.UTF8Encoding($false, $true)
            try { [void]$enc.GetString($bytes, $off, $bytes.Length - $off) } catch { $bad += "$($f.FullName): 非 UTF-8"; continue }
            # .vcxproj / 源码无 BOM；.filters 有 BOM；行尾统一 CRLF
            $bom = $off -eq 3
            if ($f.Extension -eq '.vcxproj' -and $bom) { $bad += "$($f.FullName): vcxproj 不应带 BOM" }
            if ($f.Extension -eq '.filters' -and -not $bom) { $bad += "$($f.FullName): filters 应带 BOM" }
            $text = [System.Text.Encoding]::UTF8.GetString($bytes, $off, $bytes.Length - $off)
            $lf = [regex]::Matches($text, "(?<!`r)`n").Count
            if ($lf -gt 0) { $bad += "$($f.FullName): 含 $lf 处裸 LF（应为 CRLF）" }
          }
          if ($bad.Count -gt 0) { $bad | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host "编码 / 行尾检查通过：$($files.Count) 个文件"

  build-and-test:
    name: x64 ${{ matrix.config }} 构建 + 单测
    runs-on: windows-latest
    # Debug 与 Release 之间没有依赖，拆成两个 job 交给两个 runner 并行跑。
    # 原来是单 job 里「Debug 构建 → Release 构建 → Tests」串行，墙钟是两者之和；
    # 并行后墙钟只取较慢的一侧，额外代价仅是各自 checkout 一次（~10 s）。
    # 单测两边都跑：Debug 版开着 /RTC1 与迭代器调试，能抓到 Release 看不见的问题。
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Debug
            # /Z7（OldStyle）：调试信息写进各自的 obj，绕开所有 cl 争抢同一个
            # mspdbsrv PDB 的串行锁，/MP 的文件级并行才真正吃满 4 核。
            # 只在 CI 注入，本地工程设置不动。
            extra: /p:DebugInformationFormat=OldStyle
          - config: Release
            extra: ''
    steps:
      - uses: actions/checkout@v4
        with:
          config: |
            core.autocrlf=false
            core.eol=crlf

      - name: 添加 MSBuild 到 PATH
        uses: microsoft/setup-msbuild@v2

      # /nr:false  —— 不复用常驻节点，避免 runner 收尾时被残留节点拖住
      # TrackFileAccess=false —— 干净构建没有增量可算，省掉每个文件的访问追踪
      - name: 构建（${{ matrix.config }}|x64）
        run: >-
          msbuild UNOOL.slnx /t:Build
          /p:Configuration=${{ matrix.config }} /p:Platform=x64
          /m /nr:false /v:minimal /p:TrackFileAccess=false ${{ matrix.extra }}

      # slnx 里已含 Tests 工程，单独再 build 一次只是增量空转，直接跑。
      - name: 单测（${{ matrix.config }}）
        run: '& "x64/${{ matrix.config }}/Tests.exe"'
